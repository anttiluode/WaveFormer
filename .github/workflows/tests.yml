name: Tiny WaveFormer checks
on:
  push:
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python run.py --smoke --device cpu --output-dir "$RUNNER_TEMP/waveformer-v1"
      - run: python run_v2.py --smoke --device cpu --output-dir "$RUNNER_TEMP/waveformer-v2"
